apply plugin: 'com.android.application'

android {
    namespace "com.mytv.launcher"
    compileSdk 34

    defaultConfig {
        applicationId "com.mytv.launcher"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// بدون أي dependencies خارجية - أخف وأسرع
dependencies {
}
