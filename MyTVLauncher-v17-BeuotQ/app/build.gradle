apply plugin: 'com.android.application'

android {
    namespace "com.mytv.launcher"
    compileSdk 34

    defaultConfig {
        applicationId "com.mytv.launcher"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 2
        versionName "1.1-diagnostics"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Separate diagnostic package so this APK can be installed beside
            // an older launcher build signed with a different key.
            applicationIdSuffix ".diagnostic"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// بدون أي dependencies خارجية - أخف وأسرع
dependencies {
}
